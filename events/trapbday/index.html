<script type="module">// Included in the password screen. Only this screen and encrypted files ship.
const ITERATIONS = 310000;
const encoder = new TextEncoder();
const STORAGE_KEY = 'trap-workshop-unlock-v1';
export const fromBase64 = value => Uint8Array.from(atob(value), char => char.charCodeAt(0));
export const toBase64 = bytes => btoa(String.fromCharCode(...bytes));

export async function deriveWorkshopKey(password, salt) {
  const material = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: fromBase64(salt), iterations: ITERATIONS, hash: 'SHA-256' }, material, { name: 'AES-GCM', length: 256 }, true, ['encrypt', 'decrypt']);
}
export async function decryptWorkshopBytes(bytes, key, context) {
  const data = new Uint8Array(bytes);
  if (data.length < 29) throw new Error('Invalid locked file.');
  return crypto.subtle.decrypt({ name: 'AES-GCM', iv: data.slice(0, 12), additionalData: encoder.encode(`trap-workshop:v1:${context}`) }, key, data.slice(12));
}
export function createWorkshopAccess(manifest, key, { fetcher = fetch, base = location.href, cacheStorage } = {}) {
  const directory = new URL(manifest.basePath, base);
  async function read(file, context, options = {}) {
    const url = new URL(file, directory);
    let cache;
    if (context === 'page') {
      try {
        cache = await cacheStorage?.open('trap-workshop-page-v1');
        const saved = await cache?.match(url.href);
        if (saved) return await decryptWorkshopBytes(await saved.arrayBuffer(), key, context);
      } catch { /* Missing, blocked or damaged cache falls back to the current encrypted file. */ }
    }
    const response = await fetcher(url, options);
    if (response.status !== 200) throw new Error('The locked file could not be downloaded.');
    const encrypted = await response.arrayBuffer();
    const decrypted = await decryptWorkshopBytes(encrypted, key, context);
    // Persist ciphertext only, after authentication. Never cache audio or live account data here.
    try { await cache?.put(url.href, new Response(encrypted, { headers: { 'content-type': 'application/octet-stream' } })); } catch {}
    return decrypted;
  }
  return {
    page: async () => new TextDecoder('utf-8', { fatal: true }).decode(await read(manifest.page, 'page', { cache: 'force-cache', signal: AbortSignal.timeout(30000) })),
    fetchAudio: async (source, options = {}) => {
      const url = new URL(source, base), track = manifest.audio[url.pathname];
      if (url.origin !== directory.origin || !track) throw new Error('This tape is not in the workshop.');
      return new Response(await read(track.file, url.pathname, options), { status: 200, headers: { 'content-type': track.type } });
    },
  };
}
export async function bootWorkshopLock(manifest, { doc = document, win = window, storage } = {}) {
  if (storage === undefined) { try { storage = win.sessionStorage; } catch { storage = null; } }
  let cacheStorage; try { cacheStorage = win.caches; } catch {}
  const form = doc.getElementById('workshop-unlock'), input = doc.getElementById('workshop-password');
  const button = doc.getElementById('workshop-enter'), status = doc.getElementById('workshop-unlock-status');
  const panel = doc.getElementById('workshop-lock-panel');
  let busy = false;
  function showPassword() { panel.hidden = false; }
  function forget() { try { storage?.removeItem(STORAGE_KEY); } catch {} }
  async function unlock(key) {
    const access = createWorkshopAccess(manifest, key, { base: win.location.href, fetcher: win.fetch?.bind(win) || fetch, cacheStorage });
    const html = await access.page(); // Authenticate/decrypt before replacing anything.
    try { storage?.setItem(STORAGE_KEY, JSON.stringify({ salt: manifest.salt, key: toBase64(new Uint8Array(await crypto.subtle.exportKey('raw', key))), until: Date.now() + 24 * 3600000 })); } catch {}
    doc.open(); win.TRAP_WORKSHOP_ACCESS = access; doc.write(html); doc.close();
  }
  async function submit(event) {
    event.preventDefault(); if (busy) return;
    busy = true; button.disabled = true; status.textContent = 'Finding the key…';
    try { await unlock(await deriveWorkshopKey(input.value, manifest.salt)); }
    catch (error) { forget(); status.textContent = error.name === 'OperationError' ? 'Wrong password. Try another key.' : 'Couldn’t open the workshop. Check the connection and try again.'; input.focus(); }
    finally { busy = false; button.disabled = false; }
  }
  if (!globalThis.crypto?.subtle) { status.textContent = 'Open this page over HTTPS to unlock the workshop.'; button.disabled = true; showPassword(); return; }
  form.addEventListener('submit', submit);
  try {
    const saved = JSON.parse(storage?.getItem(STORAGE_KEY) || 'null');
    if (saved?.salt !== manifest.salt || !Number.isFinite(saved.until) || saved.until <= Date.now() || !/^[A-Za-z0-9+/]{43}=$/.test(saved.key || '')) { forget(); showPassword(); return; }
    busy = true; button.disabled = true;
    await unlock(await crypto.subtle.importKey('raw', fromBase64(saved.key), 'AES-GCM', true, ['encrypt', 'decrypt']));
  } catch { forget(); status.textContent = 'Enter the password to open the workshop.'; showPassword(); }
  finally { busy = false; button.disabled = false; }
}
