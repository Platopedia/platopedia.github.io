<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="frame-title frame-description">
  <title id="frame-title">F2's circular birthday crew frame</title>
  <desc id="frame-description">A coral birthday ring with a braided golden rope, curved cream lettering, a straw-hat skull and a nautical compass. The centre and everything outside the circle are transparent.</desc>
  <defs>
    <!-- The mask applies to every decoration: nothing can cover the avatar or escape the circle. -->
    <mask id="frame-ring" maskUnits="userSpaceOnUse" x="0" y="0" width="800" height="800">
      <circle cx="400" cy="400" r="396" fill="white"/>
      <circle cx="400" cy="400" r="302" fill="black"/>
    </mask>
    <linearGradient id="coral-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6856"/><stop offset="1" stop-color="#df403b"/>
    </linearGradient>
    <pattern id="braided-rope" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <rect width="24" height="24" fill="#e9a63b"/>
      <path d="M0 1H24V13H0Z" fill="#ffd36b"/>
      <path d="M0 2H24M0 15H24" stroke="#b47b33" stroke-width="2"/>
      <path d="M0 5H24" stroke="#fff1b6" stroke-width="2"/>
    </pattern>
    <path id="birthday-arc" d="M82 400A318 318 0 0 1 718 400"/>
    <path id="date-arc" d="M57 400A343 343 0 0 0 743 400"/>
    <g id="crew-star" fill="#fff4d4" stroke="#24334b" stroke-width="2" stroke-linejoin="round">
      <path d="M0-13 4-4 14-4 6 3 9 13 0 7-9 13-6 3-14-4-4-4Z"/>
    </g>
  </defs>
  <g mask="url(#frame-ring)">
    <circle cx="400" cy="400" r="348" fill="none" stroke="#24334b" stroke-width="94"/>
    <circle cx="400" cy="400" r="378" fill="none" stroke="#ffda78" stroke-width="27"/>
    <circle cx="400" cy="400" r="378" fill="none" stroke="url(#braided-rope)" stroke-width="21"/>
    <circle cx="400" cy="400" r="393" fill="none" stroke="#24334b" stroke-width="6"/>
    <circle cx="400" cy="400" r="362" fill="none" stroke="#fff0b5" stroke-width="3"/>
    <circle cx="400" cy="400" r="334" fill="none" stroke="url(#coral-band)" stroke-width="51"/>
    <circle cx="400" cy="400" r="308" fill="none" stroke="#fff4d4" stroke-width="5"/>
    <circle cx="400" cy="400" r="303" fill="none" stroke="#24334b" stroke-width="3"/>
    <circle cx="400" cy="400" r="352" fill="none" stroke="#ffae85" stroke-width="1.5" stroke-dasharray="2 8"/>
    <text fill="#fff4d4" stroke="#24334b" stroke-width="1.5" paint-order="stroke fill" font-family="Impact, Arial Black, sans-serif" font-size="42" font-weight="900" letter-spacing="2">
      <textPath xlink:href="#birthday-arc" startOffset="50%" text-anchor="middle">F2’S BIRTHDAY</textPath>
    </text>
    <text fill="#fff4d4" font-family="Arial, sans-serif" font-size="26" font-weight="900" letter-spacing="2.5">
      <textPath xlink:href="#date-arc" startOffset="50%" text-anchor="middle">18 OCTOBER · ALL NAKAMA</textPath>
    </text>
    <use xlink:href="#crew-star" transform="translate(110 237) rotate(-30)"/>
    <use xlink:href="#crew-star" transform="translate(690 237) rotate(30)"/>
    <use xlink:href="#crew-star" transform="translate(109 562) rotate(-30)"/>
    <use xlink:href="#crew-star" transform="translate(691 562) rotate(30)"/>
    <!-- Small badges stay within the ring rather than jutting out of its silhouette. -->
    <g transform="translate(65 400)">
      <circle r="36" fill="#24334b" stroke="#ffda78" stroke-width="3"/>
      <g fill="none" stroke="#fff4d4" stroke-width="5" stroke-linecap="round"><path d="M-20-7 20 22M20-7-20 22"/></g>
      <g fill="#fff4d4" stroke="#24334b" stroke-width="1.8" stroke-linejoin="round">
        <path d="M-17-7C-19-23 19-23 17-7C20 5 14 9 11 12V22Q0 29-11 22V12C-14 9-20 5-17-7Z"/>
        <path d="M-11 13Q0 19 11 13V21Q0 27-11 21Z"/>
      </g>
      <g fill="#24334b"><ellipse cx="-8" cy="1" rx="5" ry="6"/><ellipse cx="8" cy="1" rx="5" ry="6"/><path d="M0 8-3 12H3Z"/></g>
      <path d="M-10 18Q0 22 10 18M-5 16V24M0 17V25M5 16V24" fill="none" stroke="#24334b" stroke-width="1.3"/>
      <path d="M-14-16Q-13-32 0-32Q13-32 14-16Z" fill="#ffd36b" stroke="#24334b" stroke-width="2"/>
      <path d="M-14-20Q0-13 14-20L14-15Q0-7-14-15Z" fill="#ff6150" stroke="#24334b" stroke-width="1.5"/>
      <path d="M-24-14Q-23-19-14-15Q0-8 14-15Q23-19 24-14Q21-6 0-5Q-21-6-24-14Z" fill="#ffda78" stroke="#24334b" stroke-width="2"/>
    </g>
    <g transform="translate(735 400)">
      <circle r="36" fill="#24334b" stroke="#ffda78" stroke-width="3"/>
      <circle r="25" fill="none" stroke="#ffda78" stroke-width="1.5"/>
      <path d="M0-30 7-7 30 0 7 7 0 30-7 7-30 0-7-7Z" fill="#fff4d4"/>
      <path d="M0-30 0 0 7-7ZM30 0 0 0 7 7ZM0 30 0 0-7 7ZM-30 0 0 0-7-7Z" fill="#46c8d3"/>
      <circle r="5" fill="#ff6150" stroke="#24334b" stroke-width="2"/>
    </g>
  </g>
</svg>
