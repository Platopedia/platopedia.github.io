<!doctype html>
<html lang="en" class="groups-document">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | escape }}">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="only light">
  <script data-groups-theme-init>
    (() => {
      let preference;
      try { preference = localStorage.getItem("util_theme"); } catch {}
      const theme = preference === "light" || preference === "dark" ? preference
        : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      const root = document.documentElement;
      root.dataset.theme = theme;
      // Keep Chrome's loading canvas stable; dark controls are scoped to the body.
      root.style.colorScheme = "only light";
      root.style.backgroundColor = theme === "dark" ? "#0c1522" : "#f1f6fc";
      document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "dark" ? "#142030" : "#ffffff");
    })();
  </script>
  <style>.groups-masthead{background:#fff}.groups-document[data-theme="dark"] .groups-masthead{background:#142030}</style>
  <title>{{ page.title | escape }}</title>
  <link rel="icon" href="/docs/assets/images/icons/favicon-32x32.png" sizes="32x32">
  <script defer src="/docs/assets/js/groups-theme.js?v=20261114.1"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/docs/assets/css/group-feed.css?v=20261114.6">
</head>
<body class="groups-page">
  <a class="groups-skip" href="#groups-main">Skip to Groups</a>
  <header class="groups-masthead">
    <div class="groups-masthead-inner">
      <a class="groups-brand" href="/"><img src="/docs/assets/images/logos/default.png" width="21" height="24" alt="">Platopedia</a>
      <nav class="groups-site-nav" aria-label="Platopedia">
        <ul>{% include head-menu.html %}</ul>
      </nav>
      <div class="groups-header-actions">
        <button class="groups-theme-toggle" type="button" data-groups-theme-toggle aria-label="Dark mode" aria-pressed="false" title="Switch to dark mode" disabled>
          <svg class="groups-theme-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 13A8.5 8.5 0 0 1 11 3.5 8.5 8.5 0 1 0 20.5 13Z"/></svg>
          <svg class="groups-theme-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.4 1.4m11.2 11.2L19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
        </button>
        <details class="groups-site-mobile">
          <summary>Menu <svg class="gf-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m6 9 6 6 6-6"/></svg></summary>
          <nav aria-label="Platopedia"><ul>{% include head-menu.html %}</ul></nav>
        </details>
      </div>
    </div>
  </header>
  <main class="groups-shell" id="groups-main">
    {{ content }}
  </main>
  {% if page.group_application_footer %}
  <footer class="groups-site-footer">
    <a class="groups-apply-cta" href="/groups/apply/">
      <img src="/docs/assets/images/plato.png" width="36" height="36" alt="" loading="lazy">
      <span><strong>Apply to list your group</strong><small>Get a public profile and submit posts to the feed.</small></span>
      <svg class="gf-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
    </a>
  </footer>
  {% endif %}
  {% include foot-counter.html %}
</body>
</html>
