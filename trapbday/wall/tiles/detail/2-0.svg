<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 2839.396 1439.704 1429.698"><title id="mural-title">Happy birthday, Trap — Arcade's graffiti mural</title><desc id="mural-description">140 approved hand-painted covers by 140 people. Each painting includes its original birthday wish in its description.</desc><metadata>Snapshot 8293ad0adab0fd5a. Saved 2026-11-10T14:24:38.001Z. Original vector strokes; no external assets.</metadata><defs><clipPath id="art-bounds"><rect width="1000" height="700" /></clipPath><linearGradient id="wall" x2="1" y2="1"><stop stop-color="#10282c" /><stop offset=".6" stop-color="#101a25" /><stop offset="1" stop-color="#261b30" /></linearGradient><pattern id="wall-lines" width="120" height="90" patternUnits="userSpaceOnUse"><path d="M0 89h120M60 0v89" fill="none" stroke="#83b1b0" stroke-opacity=".045" stroke-width="2" /></pattern></defs><rect width="20099.86" height="14216.98" fill="url(#wall)" /><rect width="20099.86" height="14216.98" fill="url(#wall-lines)" /><path d="M502.5 2251.18H19597.37" stroke="#6efff1" stroke-width="20.1" opacity=".5" /><text x="502.5" y="1507.49" font-family="Impact,Arial,sans-serif" font-weight="900" font-size="1045.19" fill="#f0e9d4">HAPPY BIRTHDAY, <tspan fill="#6efff1">TRAP.</tspan></text><text x="506.5" y="1989.89" font-family="monospace" font-size="221.1" letter-spacing="14.07" fill="#ff86c6">09 NOV 2026 · EVERYBODY LEFT A MARK.</text><g id="painting-0" data-painting="0" transform="translate(1669.78 3034.75) rotate(8 500 430) translate(500 430) scale(0.91) translate(-500 -430)"><title>Wytie</title><desc>Happy birthday Jaz ❤️ you are the greatest gift i have the pleasure to celebrate everyday not just on the 9th 🫶🏻 words simply cannot describe how many things im grateful to experience with you daily , thank you for being so kind hearted &amp; loving , your constant efforts to make me happy , you deserve the world &amp; may all your dreams be realized and i hope you enjoy your very very special day my sweet girl 🫶🏻&#10;Te amo ❤️❤️</desc><defs><path id="p0-stroke-0" d="M523 629 L526 632 L528 635 L528 631 L527 624 L525 614 L523 605 L520 595 L518 586 L515 578 L514 574 L511 571 L511 574 L511 579 L513 587 L515 595 L517 606 L518 612 L520 623 L523 636 L525 649 L527 659 L529 667 L531 673 L532 678 L533 681" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path id="p0-stroke-1" d="M539 607 L544 604 L547 604 L550 603 L555 596 L557 592 L559 586 L562 580 L564 575 L565 571 L562 579 L559 587 L555 598 L551 611 L547 624 L544 632 L539 640 L535 650 L532 657 L529 660 L529 657 L532 651 L536 643 L539 637 L542 635 L545 635 L548 642 L549 648 L551 655 L552 662 L553 667 L555 671 L558 673 L561 674 L565 674 L570 671 L576 666 L581 659 L585 651 L588 644" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path id="p0-stroke-2" d="M614 603 L616 600 L616 596 L617 593 L617 587 L617 581 L616 573 L614 564 L613 557 L610 551 L608 555 L608 564 L609 576 L610 591 L612 607 L613 623 L613 630 L613 642 L613 655 L613 665 L614 670 L614 674 L617 674 L618 671" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path id="p0-stroke-3" d="M641 632 L644 628 L648 623 L651 618 L653 614 L654 611 L650 609 L645 611 L639 614 L633 617 L628 620 L621 622 L618 623 L615 624" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path id="p0-stroke-4" d="M645 573 L646 570 L648 562 L649 556 L649 553 L649 559 L649 575 L651 595 L651 612 L652 626 L652 631 L653 643 L653 654 L654 663" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path id="p0-stroke-5" d="M686 649 L687 646 L687 642 L687 636 L686 626 L685 614 L683 599 L683 595 L681 584 L679 570 L677 558 L677 552 L677 549 L682 550 L686 556 L691 564 L697 576 L704 592 L710 607 L713 620 L715 630 L715 638 L715 650 L715 656 L713 660" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path id="p0-stroke-6" d="M704 608 L704 605 L700 604 L693 605 L690 606" fill="none" stroke-linecap="round" stroke-linejoin="round" /><path id="p0-stroke-