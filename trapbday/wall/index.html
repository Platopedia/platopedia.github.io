<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d171d">
  <meta name="description" content="Explore the hand-painted birthday mural made for Trap by Arcade.">
  <title>Trap’s Birthday Mural · Platopedia</title>
  <link rel="stylesheet" href="viewer.css">
  <script src="mural-data.js" defer></script>
  <script src="viewer.js" defer></script>
</head>
<body>
  <main class="mural-shell" id="mural-shell">
    <header class="mural-header">
      <a class="back-link" href="/trapbday/">← Back to the workshop</a>
      <div class="heading-row">
        <div>
          <p class="eyebrow">ARCADE · 09 NOV 2026</p>
          <h1>Trap’s birthday <em>mural.</em></h1>
        </div>
        <button class="find-button" id="find-button" type="button" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg><span>Find a name</span></button>
      </div>
    </header>
    <section class="viewport" id="mural-stage" tabindex="0" aria-label="Interactive birthday mural" aria-describedby="mural-hint">
      <img class="overview" id="mural-overview" src="overview.jpg" alt="Happy birthday, Trap. A wall of neon paintings and signatures from Arcade." fetchpriority="high" draggable="false">
      <div class="tiles" id="mural-tiles" aria-hidden="true"></div>
      <p class="stage-status" id="stage-status" role="status">Loading the mural…</p>
      <noscript><a class="stage-status" href="mural.svg">Open the original SVG</a></noscript>
    </section>
    <footer class="mural-footer">
      <div class="details">
        <p id="mural-hint"><span class="pointer-hint">Drag to move · Scroll to zoom</span><span class="touch-hint">Drag to move · Pinch to zoom</span></p>
        <p id="mural-selection" class="selection" hidden><span id="selected-name" dir="auto"></span><button id="read-button" type="button">Read wish ↗</button></p>
        <p id="mural-count" class="mural-count"></p>
      </div>
      <div class="controls" id="mural-controls" role="group" aria-label="Mural view controls">
        <button id="zoom-out" type="button" aria-label="Zoom out" disabled>−</button>
        <span id="zoom-value" aria-label="Current zoom">100%</span>
        <button id="zoom-in" type="button" aria-label="Zoom in" disabled>+</button>
        <button id="fit-wall" type="button" title="Fit the whole mural" disabled>Fit</button>
        <button id="expand-wall" type="button" aria-label="Enter fullscreen" title="Fullscreen" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M9 4H4v5m11-5h5v5m0 6v5h-5m-11-5v5h5"/></svg></button>
      </div>
    </footer>
    <dialog id="find-dialog" aria-labelledby="find-title">
      <form method="dialog" class="dialog-heading"><h2 id="find-title">Find a painting</h2><button class="close" aria-label="Close finder">×</button></form>
      <label class="sr-only" for="name-query">Search by name</label>
      <input id="name-query" type="search" placeholder="Type a name…" autocomplete="off" autofocus>
      <p class="result-count" id="result-count" role="status"></p>
      <ul class="name-list" id="name-list"></ul>
    </dialog>
    <dialog id="wish-dialog" aria-labelledby="wish-title">
      <form method="dialog" class="dialog-heading"><h2 id="wish-title" dir="auto"></h2><button class="close" aria-label="Close wish">×</button></form>
      <p id="wish-message" class="wish-message" dir="auto"></p>
    </dialog>
  </main>
</body>
</html>
